[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "tlaup"
version = "0.8.2"
description = "Install and pin TLA+ tools, compile Java overrides, and run TLC with readable output"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.27.2,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "platformdirs>=4.0,<5.0",
    "pydantic>=2.5.3",
    "truststore>=0.9.0,<1.0.0",
    "rich>=13.8.0",
    "filelock>=4.2.1",
]
authors = [
    {name = "Denis Nikolskiy", email = "nikolskiy@users.noreply.github.com"}
]
license = "MIT"
keywords = ["tla+", "tlaplus", "tlc", "model-checking", "formal-methods", "sany", "pluscal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nikolskiy/tlaup"
Repository = "https://github.com/nikolskiy/tlaup"
Issues = "https://github.com/nikolskiy/tlaup/issues"
Changelog = "https://github.com/nikolskiy/tlaup/releases"

[project.scripts]
tlaup = "tlaup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tlaup*"]

[tool.setuptools.package-data]
tlaup = ["py.typed"]
tlaup_parse = ["py.typed"]
"tlaup.resources" = ["*.yaml"]
"tlaup.java" = ["lifeline.jar", "lifeline/*.java"]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.9.0,<1.0.0",
    "mypy>=1.0.0,<2.0.0",
    "types-PyYAML>=6.0.12.12,<7.0.0.0",
    "types-requests>=2.31.0.2,<3.0.0.0",
    "poethepoet>=0.24.0,<1.0.0",
    "detect-secrets>=1.5.0,<2.0.0",
    "pre-commit>=3.5.0,<5.0.0",
    "pre-commit-hooks>=6.0.0,<7.0.0",
    "twine>=6.0.0,<7.0.0",
    "bandit>=1.9.4",
    "pytest-bdd>=9.0.1,<10",
    "coverage>=7.10.6",
    "responses>=0.23.3,<1",
    "pytest-socket>=0.8.1,<1",
    "pyte>=0.8.2,<1",
    "hypothesis>=6.170.17,<7",
    "pytest-randomly>=5.1.0,<6",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --disable-socket -p no:cacheprovider -m 'not pending'"
testpaths = ["tests"]
# ".*" keeps pytest's default for hidden folders, which a norecursedirs list replaces: Hypothesis
# writes .hypothesis/ in the repository root and warns, an error here, when it is not excluded.
norecursedirs = ["tests/integration", "tests/lifeline", "tests/fakes", "tests/fixtures", ".*"]
filterwarnings = ["error"]
markers = [
    "integration: needs Java and real jars (TLAUP_TEST_JARS)",
    "lifeline: needs a real JDK; run by the lifeline job (30 I2), not the unit job",
    "pending: written before the code it tests (03); the work package that builds the code removes the marker",
]

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["tlaup", "tlaup_parse"]

[tool.coverage.report]
show_missing = true
# fail_under: set by the last milestone 2 package, see below

[tool.ruff]
line-length = 120
target-version = "py311"
# Helper scripts kept with captured investigation data, not project code.
extend-exclude = ["tests/fixtures/research"]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes: logic errors
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "I",      # isort: import sorting
    "N",      # pep8-naming: naming conventions
    "UP",     # pyupgrade: upgrade syntax for newer python versions
    "PL",     # Pylint: various checks (convention, refactor, warning, etc.)
    "B",      # flake8-bugbear: finds likely bugs and design problems
    "SIM",    # flake8-simplify: suggests simpler python constructs
    "C4",     # flake8-comprehensions: better list/set/dict comprehensions
    "PIE",    # flake8-pie: miscellaneous lints
    "TCH",    # flake8-type-checking: move imports to type-checking blocks
    "PGH",    # pygrep-hooks: regex based checks
    "G",      # flake8-logging-format: validate logging format strings
    "RUF",    # Ruff-specific rules
    "PTH",    # flake8-use-pathlib: replace os.path with pathlib
    "ARG",    # flake8-unused-arguments: find unused function arguments
    "RET",    # flake8-return: cleaner return logic
    "TRY",    # tryceratops: prevent exception handling anti-patterns
    "BLE",    # flake8-blind-except: no blind except (two allowed, noqa with reason)
    "TID251", # flake8-tidy-imports: banned APIs (below)
]
ignore = [
    "PLR2004", # Magic value used in comparison
    "PLW1510", # subprocess.run without explicit check
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"unittest.mock.patch".msg = "no patching of our own code (design 01 T12 rule 2): use the fakes at the edges"

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "ARG001", # Unused arguments are common in tests (fixtures)
    "PLR0913", # Many arguments are common in tests (fixtures)
    "PLR0917", # Many positional arguments are common in tests (fixtures)
]
# Design 14 F9 (startup cost): command modules and the root import their heavy modules inside functions.
"src/tlaup/cmd/**" = ["PLC0415"]
"src/tlaup/cli.py" = ["PLC0415"]

[tool.bandit]
skips = ["B404", "B603", "B607"]

[tool.poe.tasks]
check = "pre-commit run --all-files"
lint = ["lint-ruff", "lint-bandit", "type-check"]
lint-ruff = "ruff check ."
lint-bandit = "bandit -c pyproject.toml -r src/tlaup src/tlaup_parse"
type-check = "mypy ."
fix = ["format", "lint-fix"]
format = "ruff format ."
lint-fix = "ruff check --fix ."
test = "pytest --cov --cov-report=term-missing"
test-clean = "python scripts/test_clean.py"
test-integration = "python -m tests.integration.discovery"
install-hooks = "pre-commit install --install-hooks -t pre-commit -t pre-push"
audit = "detect-secrets audit .secrets.baseline"
build = "uv build"
build-lifeline = "python scripts/build_lifeline.py"
docs-cli = "python scripts/gen_cli_reference.py"
test-lifeline = "pytest tests/lifeline --no-cov -p no:randomly"
clean = "python scripts/clean.py"

twine-check = "twine check dist/*.whl dist/*.tar.gz"
check-wheel = "python scripts/check_wheel.py"
# uv run poe bump patch|minor|major: pyproject.toml and uv.lock together (design 30 L4).
bump = "python scripts/bump.py"

[tool.poe.tasks.check-release]
sequence = [
    "clean",
    "build",
    "twine-check",
    "check-wheel",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = false
exclude = ["build", "tests/"]

# Per-module overrides for libraries without strict types
[[tool.mypy.overrides]]
module = "platformdirs.*"
ignore_missing_imports = true
