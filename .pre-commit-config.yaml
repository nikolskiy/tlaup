repos:
  - repo: local
    hooks:
      - id: detect-secrets
        name: detect-secrets
        entry: uv run detect-secrets-hook --baseline .secrets.baseline
        language: system
        types: [text]

      # Machine-specific data has no place in this public repository. Each
      # pattern lists its exceptions by name; add a new one only for a value
      # that is the same on every machine.
      # The patterns and their examples live in this file, so it is excluded.
      - id: no-home-paths
        name: No home folder or agent scratch paths
        # /home/x, /Users/x, /root/, macOS /var/folders/x, /run/user/N,
        # C:\Users\, and Claude Code scratch folders /tmp/claude-N.
        language: pygrep
        entry: '(?<![\w.])(?:/home|/Users|/var/folders|/run/user)/[A-Za-z0-9._-]+|(?<![\w.])/root/|(?<!\w)[A-Za-z]:[\\/]+Users[\\/]|/tmp/claude-[0-9]+'
        types: [text]
        exclude: ^\.pre-commit-config\.yaml$

      - id: no-ip-addresses
        name: No IP addresses
        # IPv4 except 127.0.0.1, the Java version 21.0.13.1 (Temurin on GitHub's
        # runners, quoted in research captures) and version pins such as >=6.0.12.12; IPv6 in
        # full form or compressed with a digit and a group of 3+ characters,
        # so Python slices such as a[1::2] do not match.
        language: pygrep
        entry: '(?<![\w.<>=~])(?!(?:127\.0\.0\.1|21\.0\.13\.1)(?!\w|\.\d))(?:(?:25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(?:25[0-5]|2[0-4]\d|1?\d?\d)(?!\w|\.\d)|(?<![\w:])(?:[0-9A-Fa-f]{1,4}:){7}[0-9A-Fa-f]{1,4}(?![\w:])|(?<![\w:])(?=[0-9A-Fa-f:]*\d)(?=[0-9A-Fa-f:]*[0-9A-Fa-f]{3})(?:[0-9A-Fa-f]{1,4}:){1,6}(?::[0-9A-Fa-f]{1,4}){1,6}(?![\w:])'
        types: [text]
        exclude: ^\.pre-commit-config\.yaml$

      - id: no-mac-addresses
        name: No MAC addresses
        # aa:bb:cc:dd:ee:ff, or aa-bb-cc-dd-ee-ff with at least one hex letter,
        # so TLC metadir timestamps such as 26-11-14-22-32-49 do not match.
        language: pygrep
        entry: '(?<![\w:])[0-9A-Fa-f]{2}(?::[0-9A-Fa-f]{2}){5}(?![\w:])|(?<![\w-])(?=[0-9-]{0,16}[A-Fa-f])[0-9A-Fa-f]{2}(?:-[0-9A-Fa-f]{2}){5}(?![\w-])'
        types: [text]
        exclude: ^\.pre-commit-config\.yaml$

      - id: no-email-addresses
        name: No email addresses
        # Allowed: GitHub noreply addresses, GitHub's SSH address git@github.com,
        # and two public upstream service addresses quoted from the TLA+ build
        # workflow.
        language: pygrep
        entry: '(?<![\w.%+-])(?!(?:github@upload\.tlapl\.us|tlaplus-action@github\.com|git@github\.com)(?!\.?[\w-]))[A-Za-z0-9._%+-]+@(?![\w-]+\.users\.noreply\.github\.com(?!\.?[\w-])|users\.noreply\.github\.com(?!\.?[\w-]))[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}'
        types: [text]
        exclude: ^\.pre-commit-config\.yaml$

      - id: no-shell-prompts
        name: No shell prompts with user and host
        # user@host:~ or user@host:/path, and [user@host dir]$ as pasted from
        # a terminal.
        language: pygrep
        entry: '(?<![\w.-])[a-z_][a-z0-9_-]*@[A-Za-z0-9-]+:[~/]|\[[a-z_][a-z0-9_-]*@[A-Za-z0-9-]+ [^\]]*\][$#]'
        types: [text]
        exclude: ^\.pre-commit-config\.yaml$

      - id: no-local-hostnames
        name: No local network host names
        # Names ending in .local, .lan, .internal, .localdomain, .intranet,
        # .corp or .home.arpa. Not when followed by a word character, a bracket
        # or a dot and a word character, so Java packages such as
        # jdk.internal.reflect and code such as threading.local() pass.
        language: pygrep
        entry: '(?<![\w.-])[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.(?:local|lan|internal|localdomain|intranet|corp|home\.arpa)(?![\w(\[-]|\.\w)'
        types: [text]
        exclude: ^\.pre-commit-config\.yaml$

      - id: no-machine-files
        name: No crash logs, dumps, credentials or personal settings
        # Refuses whole files that carry machine or personal details. The
        # same names are in .gitignore; this also stops a forced add.
        language: fail
        entry: 'This kind of file holds machine or personal details and must not be committed:'
        files: |
          (?x)(^|/)(
            hs_err_pid\d+\.log | replay_pid\d+\.log      # JVM crash logs: full environment
            | [^/]+\.(hprof|jfr)                         # heap dumps, flight recordings
            | core(\.\d+)?                               # core dumps
            | \.env(\.(?!example$)[^/]+)?                # .env files, except .env.example
            | [^/]+\.(pem|key|p12|pfx|jks|keystore|ppk)  # keys and keystores
            | id_(rsa|dsa|ecdsa|ed25519)(\.pub)?         # SSH keys
            | \.netrc | \.pypirc                         # stored credentials
            | \.(bash|zsh|python)_history | history\.repl  # shell, Python and TLA+ REPL history
            | \.idea/.* | \.vscode/.* | \.DS_Store | Thumbs\.db | [^/]+\.sw[op]  # editor and OS files
            | \.claude/settings\.local\.json             # personal Claude Code settings
          )$

      # The mechanical checks of the test rules (docs/design/01-testing.md, T12).
      - id: no-patching-own-code
        name: No patching of our own code in tests (T12 rule 2)
        # monkeypatch stays for the environment and the working folder; setattr,
        # setitem and delattr patch code. The conftests are covered by review.
        language: pygrep
        entry: 'monkeypatch\.(setattr|setitem|delattr)\b'
        files: ^tests/.*\.py$
        exclude: (^|/)conftest\.py$|^tests/fixtures/research/

      - id: no-typed-tool-output
        name: No typed tool output in tests (T12 rule 3)
        # Tool output comes from captured files under tests/parse/golden/. An
        # exception is named here by exact path, with its reason.
        language: pygrep
        entry: '@!@!@STARTMSG'
        files: ^tests/.*\.(py|feature)$
        # tests/fixtures/research/: evidence; two capture scripts there hold the marker.
        exclude: ^tests/fixtures/research/

      - id: check-added-large-files
        name: Check for added large files
        entry: uv run check-added-large-files
        language: system
        types: [file]
        exclude: ^docs/examples/sequences-ext/lib/commons-lang3-3.12.0.jar$

      - id: check-yaml
        name: Check YAML
        entry: uv run check-yaml
        language: system
        types: [yaml]

      - id: check-toml
        name: Check TOML
        entry: uv run check-toml
        language: system
        types: [toml]

      - id: check-merge-conflict
        name: Check for merge conflicts
        entry: uv run check-merge-conflict
        language: system
        types: [text]

      - id: debug-statements
        name: Debug statements (python)
        entry: uv run debug-statement-hook
        language: system
        types: [python]

      - id: detect-private-key
        name: Detect private key
        entry: uv run detect-private-key
        language: system
        types: [text]

      - id: mixed-line-ending
        name: Mixed line ending
        entry: uv run mixed-line-ending
        language: system
        types: [text]

      - id: check-case-conflict
        name: Check case conflict
        entry: uv run check-case-conflict
        language: system
        types: [text]

      - id: ruff
        name: ruff
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi, markdown]
        require_serial: true

      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -r src/tlaup
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        require_serial: true
        exclude: ^tests/

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
