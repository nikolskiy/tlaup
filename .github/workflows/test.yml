name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run linting
        run: uv run poe lint

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run poe test

      # The tests must leave no tlaup folder in the real home (design 01 T2, 30 I2).
      - name: Check that the home folder stays clean
        run: uv run python scripts/test_clean.py --home "$HOME"
