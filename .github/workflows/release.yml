name: Release

# A pushed v* tag, made by scripts/release.sh (design 30 L1, L2; docs/contributing/releasing.md).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Every action is pinned by commit hash with its release in a comment. The hashes are the ones
# research 29 found on 2026-11-19; Dependabot (package 56) moves them.
# Only build runs project code, and it holds read access only. publish holds only the id-token
# permission and release-page only contents: write; neither checks out or runs the project.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Full history, so that origin/main is there for the ancestry check.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # No cache: a cache restored here could have been written by another run, and a release
      # runs a few times a year. No Java: the lifeline jar is checked in.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Check that the tag is the project version, on main
        run: |
          VERSION=$(uv version --short)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME is not the project version v$VERSION."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit $GITHUB_SHA is not on main."
            exit 1
          fi

      - run: uv sync --locked

      - run: uv run poe lint

      - run: uv run poe test

      # Build, twine check and the wheel check (design 30 I4).
      - run: uv run poe check-release

      - name: Write the release notes from the changelog
        run: uv run python scripts/changelog_section.py "${GITHUB_REF_NAME#v}" > release-notes.md

      # Exactly the wheel and the sdist; the wheel check has seen one of each.
      - name: Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # Waits for the maintainer's approval in the pypi environment (design 30 L5).
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verbose: true

  # After publish, so that a page never announces a version that is not on PyPI.
  release-page:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: .

      # No checkout, so gh is told the repository.
      - name: Create the release page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
            --title "tlaup ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
