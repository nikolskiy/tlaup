\* expect: ok
\* V1, V3, V4, V11 and V12 with the fix of finding K2-1: what a mutation decides on is read under the lock.
\* Two processes, two names, two versions of each name's bytes, one SIGKILL.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1, p2}
    Names = {a, b}
    MaxVer = 2
    MaxKills = 1
    ReadUnderLock = TRUE
    UnpinFirst = FALSE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    PinConsistent
    NoDuplicate
    TmpLockedWhileThere
    ReaderChecked
PROPERTIES
    NoPartialBuild
    TmpOwnerSafe
    PinNeverMovesSilently
    PinWritesInstalled
    InstallPinsInstalled
