\* expect: ok
\* Windows and network file systems: the lock does not follow the TLC, only the lifeline ends
\* it (D51).  The lock and live-run properties hold, and the two that allow a killed tlaup's
\* TLC.  KeptSurvives and CheckpointSurvives do not: RunFolders-windows-checkpoint.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1, p2}
    Runners = {p1, p2}
    Cleaners = {p1, p2}
    RunIds = {r1, r2}
    Inodes = {1, 2, 3, 4, 5, 6}
    MaxKills = 1
    Recheck = TRUE
    HourRule = TRUE
    Stall = TRUE
    DeleteMayFail = TRUE
    CleanSparesCheckpoint = TRUE
    LockFollowsTLC = FALSE
    UnlinkOnRelease = FALSE
    KeptMeansKeep = TRUE
SYMMETRY SymAll
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    PoolEnough
    LockExclusive
    HeldIsCurrent
    LiveRunLocked
    OneTLCPerFolderUnlessKilled
PROPERTIES
    NoDeleteUnderLiveTLC
    KeptIsComplete
