\* expect: violated ChildEndsWithTlaup
\* Without the lifeline (before D51): a tlaup killed with SIGKILL leaves its child running,
\* and a child that ignores SIGTERM runs for ever.
SPECIFICATION FairSpec
CONSTANTS
    MaxSignals = 3
    Defer = TRUE
    Lifeline = FALSE
CHECK_DEADLOCK FALSE
PROPERTIES
    ChildEndsWithTlaup
