\* expect: ok
\* Three processes, one name, two versions, one SIGKILL.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1, p2, p3}
    Names = {a}
    MaxVer = 2
    MaxKills = 1
    ReadUnderLock = TRUE
    UnpinFirst = FALSE
    CheckInstalled = TRUE
SYMMETRY Symmetry
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    PinConsistent
    NoDuplicate
    TmpLockedWhileThere
    ReaderChecked
PROPERTIES
    NoPartialBuild
    TmpOwnerSafe
    PinNeverMovesSilently
    PinWritesInstalled
    InstallPinsInstalled
