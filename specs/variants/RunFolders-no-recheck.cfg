\* expect: ok
\* Question 30, the other answer: no re-check.  Nothing stalls for an hour, no deletion fails.
\* The lock invariants are left out here: RunFolders-no-recheck-stale.cfg shows they do not hold.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1, p2}
    Runners = {p1, p2}
    Cleaners = {p1, p2}
    RunIds = {r1, r2}
    Inodes = {1, 2, 3, 4, 5, 6}
    MaxKills = 1
    Recheck = FALSE
    HourRule = TRUE
    Stall = FALSE
    DeleteMayFail = FALSE
    CleanSparesCheckpoint = TRUE
    LockFollowsTLC = TRUE
    UnlinkOnRelease = FALSE
    KeptMeansKeep = TRUE
SYMMETRY SymAll
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    PoolEnough
    LiveRunLocked
    OneTLCPerFolder
PROPERTIES
    NoDeleteUnderTLC
    KeptSurvives
