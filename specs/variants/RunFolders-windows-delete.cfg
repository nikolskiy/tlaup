\* expect: violated NoDeleteUnderTLC
\* The window that remains on Windows (D51, D15): in the seconds before the lifeline ends the
\* TLC of a killed tlaup, its lock is free and a sweep or `cache clean` deletes its folder.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1, p2}
    Runners = {p1, p2}
    Cleaners = {p1, p2}
    RunIds = {r1, r2}
    Inodes = {1, 2, 3, 4, 5, 6}
    MaxKills = 1
    Recheck = TRUE
    HourRule = TRUE
    Stall = TRUE
    DeleteMayFail = TRUE
    CleanSparesCheckpoint = TRUE
    LockFollowsTLC = FALSE
    UnlinkOnRelease = FALSE
SYMMETRY SymAll
CHECK_DEADLOCK FALSE
PROPERTIES
    NoDeleteUnderTLC
