\* expect: ok
\* Finding FC2 of the 2026-11-20 review: one process that may start runs, sweep and clean, and
\* three run ids, so that one folder can be resumed twice and a resume can be resumed.  Run ids
\* are never reused, so the number of ids bounds the number of runs.  The main constants.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1}
    Runners = {p1}
    Cleaners = {p1}
    RunIds = {r1, r2, r3}
    Inodes = {1, 2, 3, 4, 5, 6}
    MaxKills = 1
    Recheck = TRUE
    HourRule = TRUE
    Stall = TRUE
    DeleteMayFail = TRUE
    CleanSparesCheckpoint = TRUE
    LockFollowsTLC = TRUE
    UnlinkOnRelease = FALSE
    KeptMeansKeep = TRUE
SYMMETRY SymIds
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    PoolEnough
    LockExclusive
    HeldIsCurrent
    LiveRunLocked
    OneTLCPerFolder
PROPERTIES
    NoDeleteUnderTLC
    KeptSurvives
    CheckpointSurvives
    KeptIsComplete
