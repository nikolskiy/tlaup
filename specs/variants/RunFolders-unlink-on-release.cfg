\* expect: violated LockExclusive
\* Question 30: a lock library that unlinks the name when it releases (filelock 3.20.4 to
\* 3.29.4) removes the lock file of whoever took the lock after the holder removed its own;
\* two lock objects then hold the lock of one name.  The reason for filelock>=4.2.1.
\* Three processes, as in RunFolders-three; the sweeps' and cleans' locks are FileLocks.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1, p2, p3}
    Runners = {p1}
    Cleaners = {p1, p2, p3}
    RunIds = {r1}
    Inodes = {1, 2, 3, 4, 5}
    MaxKills = 0
    Recheck = TRUE
    HourRule = TRUE
    Stall = TRUE
    DeleteMayFail = TRUE
    CleanSparesCheckpoint = TRUE
    LockFollowsTLC = TRUE
    UnlinkOnRelease = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    LockExclusive
