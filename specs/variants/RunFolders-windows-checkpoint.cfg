\* expect: violated CheckpointSurvives
\* The window on Windows (D51, D15) reached through a resume: it takes the free lock of a killed
\* tlaup's folder, stops before its own TLC starts and settles with no checkpoint yet; the
\* orphan TLC then commits one; the resume's end deletes the folder and the checkpoint.
SPECIFICATION Spec
CONSTANTS
    Procs = {p1, p2}
    Runners = {p1, p2}
    Cleaners = {p1, p2}
    RunIds = {r1, r2}
    Inodes = {1, 2, 3, 4, 5, 6}
    MaxKills = 1
    Recheck = TRUE
    HourRule = TRUE
    Stall = TRUE
    DeleteMayFail = TRUE
    CleanSparesCheckpoint = TRUE
    LockFollowsTLC = FALSE
    UnlinkOnRelease = FALSE
SYMMETRY SymAll
CHECK_DEADLOCK FALSE
PROPERTIES
    CheckpointSurvives
