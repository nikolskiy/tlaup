\* expect: ok
\* R6 as written, with a lock library that re-checks (the locked filelock 4.2.10),
\* and `cache clean` sparing a resumable checkpoint unless --all is given (decision D49).
\* Two processes that may each do everything, two run ids, one SIGKILL.
SPECIFICATION Spec
