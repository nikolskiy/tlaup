    Procs = {p1, p2}
    Runners = {p1, p2}
    Cleaners = {p1, p2}
    RunIds = {r1, r2}
    Inodes = {1, 2, 3, 4, 5, 6}
    MaxKills = 1
    Recheck = TRUE
    HourRule = TRUE
    Stall = TRUE
    DeleteMayFail = TRUE
    CleanSparesCheckpoint = TRUE
SYMMETRY SymAll
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    PoolEnough
    LockExclusive
    HeldIsCurrent
    LiveRunLocked
    OneTLCPerFolder
PROPERTIES
    NoDeleteUnderTLC
    KeptSurvives
    CheckpointSurvives
