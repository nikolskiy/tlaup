\* expect: ok
\* G3 and R2 as written.  Three signals, each of four kinds, at any moment; every set of signals
\* ignored at entry; with and without leave_interrupt; a child that ends by itself and one that must be killed.
SPECIFICATION FairSpec
CONSTANTS
    MaxSignals = 3
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoDefaultHandler
    ChildNeverOrphaned
    SignalNeverLost
    ExitCodeAsSeen
    IgnoredStaysIgnored
    NothingStartsAfterSeenSignal
    SignalReachesChild
PROPERTIES
    LateSignalChangesNothing
    IgnoredChangesNothing
    SecondSignalKills
    LeftAloneNotRecorded
    Stops
