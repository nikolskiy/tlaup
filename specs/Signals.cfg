\* expect: ok
\* G3 and R2 as written after D51 and D52.  Three signals, each of four kinds, at any moment;
\* every set of signals ignored at entry; with and without leave_interrupt; a parsed and a raw
\* run; a child that ends by itself and one that must be killed; checkpoints; tlaup killed.
SPECIFICATION FairSpec
CONSTANTS
    MaxSignals = 3
    Defer = TRUE
    Lifeline = TRUE
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    NoDefaultHandler
    ChildNeverOrphaned
    SignalNeverLost
    ExitCodeAsSeen
    IgnoredStaysIgnored
    NothingStartsAfterSeenSignal
    SignalReachesChild
PROPERTIES
    LateSignalChangesNothing
    IgnoredChangesNothing
    SecondSignalKills
    LeftAloneNotRecorded
    FirstSignalWaitsForCheckpoint
    Stops
    ChildEndsWithTlaup
